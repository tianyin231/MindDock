[project]
name = "minddock"
version = "0.1.0"
description = "MindDock 后端：QQ 收件、自动归类、提醒与第二大脑"
requires-python = ">=3.12,<3.13"
dependencies = [
    "argon2-cffi>=25.1.0",
    "fastapi>=0.161.1",
    "httpx2>=2.16.0",
    "pillow>=12.3,<13",
    "pydantic-settings>=2.16.1",
    "pynacl>=1.6.2",
    "pyotp>=2.10.0",
    "segno>=1.6.6",
    "trafilatura>=2.3.1",
    "tzdata>=2026.5",
    "uvicorn[standard]>=0.54.0",
    "websockets>=17.3",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# 行宽交给 ruff format；它不拆分 SQL 和中文提示等长字符串，这类行不再单独报错
ignore = ["E501"]
