# 由 MindDock 的 install.sh 写入宝塔 nginx 的四层配置目录 /www/server/panel/vhost/nginx/tcp/
# （__DOMAIN__ 会被替换为实际域名）。443 端口按 TLS 握手里的域名（SNI）分流，只转发、不解密。
# 后端都要能接收 PROXY protocol（用于获得访客真实 IP）。
# 如果 443 原先被其他程序占用（例如 xray），把它改为监听本机其他端口，再把 default 指向它。
map $ssl_preread_server_name $sni_443_upstream {
    __DOMAIN__  127.0.0.1:8443;    # MindDock（Caddy）
    default     127.0.0.1:8443;
}

server {
    listen 443;
    ssl_preread on;
    proxy_pass $sni_443_upstream;
    proxy_protocol on;
    proxy_connect_timeout 5s;
    proxy_timeout 1h;
}
