# 由 MindDock 的 install.sh 写入宝塔 nginx 的站点目录（__DOMAIN__ 会被替换为实际域名）。
# 80 端口的请求全部交给 Caddy：它处理证书验证，并把其余请求跳转到 8443 上的 HTTPS 面板。
# 也可以改为在宝塔里添加"反向代理"网站，目标 http://127.0.0.1:8081，效果相同且能在面板中管理。
server {
    listen 80;
    server_name __DOMAIN__;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
    }

    access_log /www/wwwlogs/__DOMAIN__.log;
    error_log /www/wwwlogs/__DOMAIN__.error.log;
}
