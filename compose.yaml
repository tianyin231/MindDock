# MindDock 部署编排。服务器上的 /opt/minddock 是本仓库的克隆，配置写在同目录的 .env（install.sh 生成）。
# 两种入口模式（install.sh 自动选择并写入 .env）：
# - 宝塔模式（默认）：Caddy 只监听本机，宝塔 nginx 把 443 上本域名的连接转给 Caddy 的 8443
#   （见 deploy/nginx-sni-443.conf），把 80 端口反向代理到 Caddy 的 80（见 deploy/nginx-site.conf）；
# - 独立模式：服务器上没有宝塔，Caddy 直接占用宿主的 80 / 443（deploy/Caddyfile.direct）。

name: minddock

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

# panel / bot / worker 使用同一个镜像和数据目录，只是启动命令不同
x-app: &app
  image: ghcr.io/tianyin231/minddock:${MINDDOCK_TAG:-main}
  restart: unless-stopped
  env_file: .env
  environment:
    MINDDOCK_OPENLIST_URL: http://openlist:5244
  volumes:
    - ./data/panel:/data
  networks: [internal]
  logging: *logging

services:
  panel:
    <<: *app
    mem_limit: 512m

  bot:
    <<: *app
    command: ["python", "-m", "minddock", "bot"]
    depends_on: [panel]
    healthcheck:
      disable: true
    mem_limit: 192m

  worker:
    <<: *app
    command: ["python", "-m", "minddock", "worker"]
    depends_on: [panel]
    healthcheck:
      disable: true
    mem_limit: 384m

  openlist:
    image: openlistteam/openlist:v4.2.7
    restart: unless-stopped
    environment:
      OPENLIST_ADMIN_PASSWORD: ${MINDDOCK_OPENLIST_ADMIN_PASSWORD:?需要在 .env 中设置}
      UMASK: "022"
      TZ: Asia/Shanghai
    volumes:
      - ./data/openlist:/opt/openlist/data
    networks: [internal]
    mem_limit: 384m
    logging: *logging

  caddy:
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    depends_on: [panel]
    command: ["caddy", "run", "--config", "/etc/caddy/${MINDDOCK_CADDYFILE:-Caddyfile}", "--adapter", "caddyfile"]
    ports:
      - "${MINDDOCK_HTTPS_BIND:-127.0.0.1:8443}:8443"
      - "${MINDDOCK_HTTP_BIND:-127.0.0.1:8081}:80"
    environment:
      MINDDOCK_DOMAIN: ${MINDDOCK_DOMAIN:?需要在 .env 中设置}
    volumes:
      # 两份 Caddyfile 共用 site.caddy，整个目录只读挂进去
      - ./deploy:/etc/caddy:ro
      - ./data/caddy/data:/data
      - ./data/caddy/config:/config
    networks: [internal]
    mem_limit: 128m
    logging: *logging

networks:
  internal: {}
